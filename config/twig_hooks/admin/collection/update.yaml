sylius_twig_hooks:
    hooks:
        'sylius_cms.admin.collection.update.content':
            form_error_alert:
                enabled: false
            form:
                component: 'sylius_cms:admin:collection:form'
                props:
                    resource: '@=_context.resource'
                    form: '@=_context.form'
                    template: '@SyliusCmsPlugin/admin/shared/crud/common/content/form.html.twig'
                configuration:
                    method: 'PUT'
                    form_errors: false
                priority: 0

        'sylius_cms.admin.collection.update.content.form':
            errors:
                template: '@SyliusCmsPlugin/admin/shared/crud/common/content/form/errors.html.twig'
                configuration:
                    message: 'sylius_cms.ui.collection_form.errors.update'
                priority: 100
            sections:
                template: '@SyliusCmsPlugin/admin/collection/form/sections.html.twig'
                priority: 0

        'sylius_cms.admin.collection.update.content.form.sections':
            general:
                enabled: false
            elements:
                template: '@SyliusCmsPlugin/admin/collection/form/sections/elements.html.twig'
                priority: 100
            settings:
                template: '@SyliusCmsPlugin/admin/collection/form/sections/settings.html.twig'
                priority: 0

        'sylius_cms.admin.collection.update.content.form.sections.elements':
            search:
                template: '@SyliusCmsPlugin/admin/collection/form/sections/elements/search.html.twig'
                priority: 100
            list:
                template: '@SyliusCmsPlugin/admin/collection/form/sections/elements/list.html.twig'
                priority: 0

        'sylius_cms.admin.collection.update.content.form.sections.settings':
            general:
                template: '@SyliusCmsPlugin/admin/shared/crud/common/content/form/sections/settings/general.html.twig'
                priority: 200
            type:
                template: '@SyliusCmsPlugin/admin/collection/form/sections/settings/type.html.twig'
                priority: 100
            usage:
                template: '@SyliusCmsPlugin/admin/collection/form/sections/settings/usage.html.twig'
                priority: 0

        'sylius_cms.admin.collection.update.content.form.sections.settings.general':
            code:
                template: '@SyliusCmsPlugin/admin/shared/crud/common/content/form/sections/settings/general/code.html.twig'
                configuration:
                    help: 'sylius_cms.ui.collection_form.settings.code_locked_help'
                priority: 100
            name:
                template: '@SyliusCmsPlugin/admin/shared/crud/common/content/form/sections/settings/general/name.html.twig'
                priority: 0
