sylius_twig_hooks:
    hooks:
        'sylius_cms.admin.template.update.content':
            form_error_alert:
                enabled: false
            form:
                component: 'sylius_cms:admin:template:form'
                props:
                    resource: '@=_context.resource'
                    form: '@=_context.form'
                    template: '@SyliusCmsPlugin/admin/shared/crud/common/content/form.html.twig'
                configuration:
                    method: 'PUT'
                    form_errors: false
                priority: 0

        'sylius_cms.admin.template.update.content.form':
            errors:
                template: '@SyliusCmsPlugin/admin/shared/crud/common/content/form/errors.html.twig'
                configuration:
                    message: 'sylius_cms.ui.template_form.errors.update'
                priority: 100
            sections:
                template: '@SyliusCmsPlugin/admin/template/form/sections.html.twig'
                priority: 0

        'sylius_cms.admin.template.update.content.form.sections':
            general:
                enabled: false
            elements:
                template: '@SyliusCmsPlugin/admin/template/form/sections/elements.html.twig'
                priority: 100
            settings:
                template: '@SyliusCmsPlugin/admin/template/form/sections/settings.html.twig'
                priority: 0

        'sylius_cms.admin.template.update.content.form.sections.settings':
            general:
                template: '@SyliusCmsPlugin/admin/shared/crud/common/content/form/sections/settings/general.html.twig'
                priority: 100
            type:
                template: '@SyliusCmsPlugin/admin/template/form/sections/settings/type.html.twig'
                priority: 0

        'sylius_cms.admin.template.update.content.form.sections.settings.general':
            name:
                template: '@SyliusCmsPlugin/admin/shared/crud/common/content/form/sections/settings/general/name.html.twig'
                priority: 0
