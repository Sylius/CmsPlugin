                                        text2:
                                            type: "textarea"
                                            data:
                                                textarea: |
                                                    <p>The modern city woman needs versatility above all else, and summer 2025 delivers with comfortable yet chic pieces that blur the lines between athleisure and street style. This trend celebrates the hybrid approach—clothing that works equally well for a coffee date, casual work day, or spontaneous evening plans. Breathable fabrics meet contemporary silhouettes, while sustainable materials reflect the conscious consumer's values. It's about looking effortlessly put-together while being ready for anything the city throws your way.</p>
                                        spacer7:
