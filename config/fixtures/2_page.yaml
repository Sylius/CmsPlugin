                                        text3:
                                            type: "textarea"
                                            data:
                                                textarea: |
                                                    <p>Sophisticated summer evenings call for a new kind of elegance - one that embraces relaxed sophistication without sacrificing femininity. Summer 2025's approach to evening wear ditches heavy fabrics for flowing silhouettes in unexpected colors and breathable materials. Think pastel blazers, linen dresses with impeccable drape, and elevated basics that prove you can be both comfortable and refined. It's about modern sophistication that respects the season's heat while commanding attention at the finest establishments. </p>
                                        spacer10:
                                            type: "spacer"
                                            data:
                                                spacer: 20
                                        eveningwear:
                                            type: "products_grid"
                                            data:
                                                products_grid:
                                                    products:
                                                        - "Classic_Summer_Elegance"
                                                        - "Festival_Ruffle_Wrap"
                                                        - "Evening_Star_Gown"
                                                        - "Denim_Daydream"
                                        spacer11:
