                                        text1:
                                            type: "textarea"
                                            data:
                                                textarea: |
                                                    <p>Summer 2025's beach aesthetic draws heavy inspiration from the French Riviera, embracing effortless elegance with a feminine twist. This season is all about looking polished while feeling completely relaxed - think flowing cover-ups that catch the ocean breeze, vibrant swimwear that makes a statement, and classic nautical patterns reimagined for the modern woman. The key is achieving that coveted "just stepped off a yacht" look with pieces that transition seamlessly from beach club to seaside cocktails.</p>
